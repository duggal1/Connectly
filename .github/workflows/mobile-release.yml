name: Mobile release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Generate Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Stage APK
        run: cp app/android/app/build/outputs/apk/release/app-release.apk connectly-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: connectly-android
          path: connectly-android.apk
          if-no-files-found: error

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Generate iOS project
        working-directory: app
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install
      - name: Archive unsigned iOS app
        working-directory: app
        run: >-
          xcodebuild
          -workspace ios/Connectly.xcworkspace
          -scheme Connectly
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/Connectly.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Connectly.xcarchive/Products/Applications/Connectly.app" "$RUNNER_TEMP/ipa/Payload/Connectly.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/connectly-ios.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: connectly-ios
          path: connectly-ios.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [android, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: connectly-android
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: connectly-ios
          path: release-assets
      - name: Create release and upload builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cat > release-notes.md <<'EOF'
          Connectly mobile builds from the selected source commit.

          - Android: install the APK on an Android device.
          - iOS: this IPA is unsigned. Sign it with a free Apple ID using a sideloading tool such as AltStore, Sideloadly, or Xcode. It is not App Store ready.
          EOF
          gh release create "$RELEASE_TAG" \
            release-assets/connectly-android.apk \
            release-assets/connectly-ios.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Connectly $RELEASE_TAG" \
            --notes-file release-notes.md
